[project]
name = "sentinel"
version = "0.1.0"
description = "Deterministic safety layer for robot actions: the LLM decides how, Sentinel decides whether."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "daqp>=0.10.3",
    "fastapi>=0.162.0",
    "imageio[ffmpeg]>=2.38.1",
    "meta-sam-parser>=0.1.0",
    "mink>=1.3.0",
    "mujoco>=3.17.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
